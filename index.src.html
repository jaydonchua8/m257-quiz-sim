<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const QBY = Object.fromEntries(QUESTIONS.concat(DRILLS).map(q => [q.id, q]));
DRILLS.forEach(d => d.kind = 'drill');
QUESTIONS.forEach(q => { q.kind = 'app'; q.uses = USES[q.id] || []; });
const PTS = 10;

/* storage */
const KEY = 'm257-quiz-sim-v1';
let store = { best: {}, tries: {}, code: {}, seeds: {}, exam: null, history: [], streak: 0 };
try { const raw = localStorage.getItem(KEY); if (raw) store = Object.assign(store, JSON.parse(raw)); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} };
const best = id => store.best[id] || 0;
const tries = id => store.tries[id] || 0;
const done = id => best(id) >= PTS;

/* rng */
function rng(seed) {
  let a = seed >>> 0;
  const f = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  return { f, int: (lo, hi) => lo + Math.floor(f() * (hi - lo + 1)), pick: arr => arr[Math.floor(f() * arr.length)] };
}
const newSeed = () => 1000 + Math.floor(Math.random() * 899000);
function paramsFor(q, seed) { let p = q.params(rng(seed)); if (q.fix) p = q.fix(p); return p; }
const seedOf = id => store.seeds[id] || (store.seeds[id] = newSeed());

/* python */
let worker = null, ready = false, pending = new Map(), runId = 0, timer = null, rtState = ['load', 'starting python'];
function startWorker() {
  ready = false; setRt('load', 'starting python');
  try { worker = new Worker('worker.js'); } catch (e) { setRt('bad', 'python unavailable'); return; }
  worker.onmessage = ev => {
    const m = ev.data;
    if (m.type === 'status') setRt('load', m.text.toLowerCase());
    else if (m.type === 'ready') { ready = true; setRt('ok', 'python ready'); refreshRun(); }
    else if (m.type === 'fatal') { setRt('bad', 'python failed to load'); console.error(m.text); }
    else if (m.type === 'result') { const cb = pending.get(m.id); if (cb) { pending.delete(m.id); clearTimeout(timer); cb(m.result); } }
  };
  worker.onerror = e => { setRt('bad', 'python failed to load'); console.error(e.message); };
}

/* recall game */

  $('#app').innerHTML = `<main class="page work">
    <div class="g-bar">
      <button type="button" class="link" id="back">← quit</button>
      <span class="sp"></span>
      <span class="combo ${G.bump ? 'bump' : ''}">${mult > 1 ? '×' + mult : ''}</span>
      <span class="g-score"><b>${G.score}</b></span>
      <span class="lives" aria-label="${G.lives} lives left">${Array.from({ length: LIVES }, (_, n) => `<i class="${n >= G.lives ? 'gone' : ''} ${G.hit && n === G.lives ? 'hit' : ''}"></i>`).join('')}</span>
    </div>
    <div class="prog"><i style="width:${100 * G.i / G.deck.length}%"></i></div>
    <section class="card-q">
      <div class="eyebrow">${esc(RECALL_SECTIONS[c.s].toLowerCase())} · ${G.i + 1} of ${G.deck.length}${G.elim ? ' · <span class="aid">hint used · half points, not counted toward learned</span>' : ''}</div>
      <h2>${fmtq(c.q)}</h2>
    </section>
    <div class="opts">${optHTML}</div>
    ${ans === null && !G.elim ? `<div class="row"><button type="button" class="link" id="gHint">hint <small style="font-family:var(--mono)">h</small> · removes 2 wrong answers, card won't count</button></div>` : ''}
    ${ans !== null ? `<section class="why ${ans === 0 ? 'good' : ''}"><p>${fmtq(c.why)}</p><button type="button" class="next" id="gNext">${G.lives <= 0 || G.i === G.deck.length - 1 ? 'results' : 'next'} →<small>↵</small></button></section>` : ''}
  </main>`;
  G.bump = false; G.hit = false;
  $('#back').onclick = endRecall;
  if ($('#gHint')) $('#gHint').onclick = useHint;
  document.querySelectorAll('.opt').forEach(b => b.onclick = () => pick(Number(b.dataset.k), b));
  if ($('#gNext')) { $('#gNext').onclick = gNext; $('#gNext').focus({ preventScroll: true }); }
}
function useHint() {
  if (!G || G.picked !== null || G.elim) return;
  G.elim = shuffle([1, 2, 3]).slice(0, 2); G.hints++;
  renderGame();
}
function pick(k, btn) {
  if (!G || G.picked !== null) return;
  const c = G.deck[G.i].c, rec = Object.assign({ right: 0, wrong: 0, streak: 0 }, rCard(c.id));
  G.picked = k;
  if (k === 0 && G.elim) {
    const gain = 50; G.score += gain;
    const r = btn.getBoundingClientRect();
    const f = document.createElement('div'); f.className = 'float'; f.textContent = '+' + gain;
    f.style.left = (r.left + r.width - 70) + 'px'; f.style.top = (r.top - 4) + 'px';
    document.body.appendChild(f); setTimeout(() => f.remove(), 900);
  } else if (k === 0) {
    G.combo++;
    const gain = 100 * (1 + Math.floor((G.combo - 1) / 3));
    G.score += gain; rec.right++; rec.streak++;
    if (G.combo % 3 === 0) G.bump = true;
    const r = btn.getBoundingClientRect();
    burst(r.left + r.width - 40, r.top + r.height / 2);
    const f = document.createElement('div'); f.className = 'float'; f.textContent = '+' + gain;
    f.style.left = (r.left + r.width - 70) + 'px'; f.style.top = (r.top - 4) + 'px';
    document.body.appendChild(f); setTimeout(() => f.remove(), 900);
  } else {
    G.combo = 0; G.lives--; G.hit = true; rec.wrong++; rec.streak = 0;
    G.missed.push(c);
  }
  rStore().cards[c.id] = rec; save();
  renderGame();
  if (k === 0) { clearTimeout(G.t); const gi = G.i; G.t = setTimeout(() => { if (G && G.i === gi && view === 'game') gNext(); }, 900); }
}
function gNext() {
  if (!G) return;
  clearTimeout(G.t);
  if (G.lives <= 0 || G.i >= G.deck.length - 1) return endRecall();
  G.i++; G.picked = null; G.elim = null; renderGame();
}
function endRecall() {
  if (!G) return renderHome();
  clearTimeout(G.t);
  const rs = rStore(), done = G.i + (G.picked !== null ? 1 : 0);
  const newBest = G.score > (rs.best || 0) && G.score > 0;
  if (done > 0) { rs.games = (rs.games || 0) + 1; if (newBest) rs.best = G.score; save(); }
  const g = G; G = null; view = 'recallEnd';
  const perfect = g.missed.length === 0 && done === g.deck.length;
  $('#app').innerHTML = `<main class="page">
    <div class="top"><button type="button" class="link" id="back">← home</button></div>
    <section class="hero"><h1>${g.score}<span>.</span></h1><p>${newBest ? 'New best. ' : rs.best ? 'Best ' + rs.best + '. ' : ''}${perfect && !g.hints ? 'Flawless round.' : perfect ? 'No misses, ' + g.hints + ' hint' + (g.hints > 1 ? 's' : '') + '.' : g.lives <= 0 ? 'Out of lives after ' + done + ' cards.' : done + ' cards played.'} ${rLearned()}/${RECALL.length} learned (right twice in a row).</p></section>
    <div><button type="button" class="go" id="again">Play again →</button></div>
    ${g.missed.length ? `<section class="track"><div class="track-h"><span style="font-size:20px;font-weight:600">Missed</span><span class="n">${g.missed.length}</span></div><div class="missed">${g.missed.map(c => `<div><span class="q">${fmtq(c.q)}</span>${c.plain ? `<span>${esc(c.o[0])}</span>` : `<code>${esc(c.o[0])}</code>`}</div>`).join('')}</div></section>` : ''}
    <section class="tracks">${Object.keys(RECALL_SECTIONS).map(s => { const cs = RECALL.filter(c => c.s === s); return `<div class="sec"><span>${esc(RECALL_SECTIONS[s])}</span><span class="n" style="font-family:var(--mono);font-size:13px;color:var(--muted)">${cs.filter(c => rIsLearned(c.id)).length}/${cs.length}</span><div class="dots">${cs.map(c => `<span class="d ${rCls(c.id)}"></span>`).join('')}</div></div>`; }).join('')}</section>
  </main>`;
  $('#back').onclick = renderHome;
  $('#again').onclick = startRecall;
  $('#again').focus({ preventScroll: true });
}
document.addEventListener('keydown', e => {
  if (view !== 'game' || !G || e.metaKey || e.ctrlKey || e.altKey) return;
  if (G.picked === null && (e.key === 'h' || e.key === 'H')) { e.preventDefault(); useHint(); }
  else if (G.picked === null && /^[1-4]$/.test(e.key)) {
    const b = document.querySelectorAll('.opt')[Number(e.key) - 1];
    if (b) { e.preventDefault(); pick(Number(b.dataset.k), b); }
  } else if (G.picked !== null && (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowRight')) {
    e.preventDefault(); gNext();
  }
});

let refTab = 'doc', refQ = '';
function toggleDrawer() { const d = $('#drawer'); d.hidden = !d.hidden; if (!d.hidden) renderDrawer(); }
function closeDrawer() { $('#drawer').hidden = true; }
function renderDrawer() {
  const lock = view === 'work' && isMock() && store.exam && !store.exam.done;
  if (lock) refTab = 'doc';
  $('#dh').innerHTML = `<button type="button" class="tabb ${refTab === 'doc' ? 'on' : ''}" data-t="doc">course doc</button>${lock ? '' : `<button type="button" class="tabb ${refTab === 'sheet' ? 'on' : ''}" data-t="sheet">cheat sheet</button><button type="button" class="tabb ${refTab === 'pat' ? 'on' : ''}" data-t="pat">patterns</button>`}<span class="sp"></span><button type="button" class="link" id="dClose">close</button>`;
  document.querySelectorAll('.tabb').forEach(t => t.onclick = () => { refTab = t.dataset.t; renderDrawer(); });
  $('#dClose').onclick = closeDrawer;
  const data = refTab === 'doc' ? DOC : refTab === 'sheet' ? Object.keys(RECALL_SECTIONS).map(k => [RECALL_SECTIONS[k], RECALL.filter(c => c.s === k).map(c => [c.o[0], c.q.replace(/`/g, '') + ' ' + c.why.replace(/`/g, '')])]) : Object.keys(GROUPS).map(g => [GROUPS[g], DRILLS.filter(d => d.group === g).map(d => [d.title, d.idea])]);
  const v = refQ.trim().toLowerCase();
  const html = data.map(([h, fs]) => { const hits = fs.filter(f => !v || (f[0] + ' ' + f[1]).toLowerCase().includes(v)); return hits.length ? `<h5>${esc(h)}</h5>${hits.map(f => `<div class="fn"><code>${esc(f[0])}</code><p>${esc(f[1])}</p></div>`).join('')}` : ''; }).join('');
  $('#db').innerHTML = `<input id="refQ" type="search" placeholder="search" value="${esc(refQ)}" aria-label="Search the reference">${html || '<p class="empty">No matches.</p>'}`;
  const s = $('#refQ');
  s.oninput = () => { refQ = s.value; const pos = s.selectionStart; renderDrawer(); const n = $('#refQ'); n.focus(); n.setSelectionRange(pos, pos); };
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

if (store.exam && store.exam.dur !== undefined) { delete store.exam.dur; delete store.exam.start; }
startWorker();
renderHome();
