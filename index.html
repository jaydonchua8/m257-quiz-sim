<script>
const py = String.raw;

const LABS = {
  1: 'Lab 1 · Python basics',
  2: 'Lab 2 · Vectors',
  3: 'Lab 3 · Matrix operations',
  4: 'Lab 4 · Linear systems',
  5: 'Lab 5 · Graphs',
  6: 'Lab 6 · DCT & coordinates'
};

const QUESTIONS = [
/* ---------------- LAB 1 ---------------- */
{
  id: 'l1-stats', lab: 1, title: 'Count and reverse a list',
  params: r => ({ d: r.pick([3, 4, 5]) }),
  prompt: p => `
<p>Write a function <code>stats(A, n)</code>. <code>A</code> is a Python list of integers and <code>n</code> is a positive integer.</p>
<p>It returns a tuple <code>(count, last)</code> where</p>
<ul>
<li><code>count</code> is the number of entries of <code>A</code> that are divisible by ${p.d}</li>
<li><code>last</code> is a list with the last <code>n</code> entries of <code>A</code>, in reverse order</li>
</ul>
<p>Example with <code>A = [6, 1, ${p.d * 3}, 7, 2]</code> and <code>n = 3</code>:</p>
<pre>stats(A, 3)   # returns (${(6 % p.d === 0 ? 1 : 0) + 1}, [2, 7, ${p.d * 3}])</pre>
<p>We test your function on other lists, so do not hard-code results.</p>`,
  given: [['A', 'list', 'example list (for debugging)'], ['n', 'int', 'example n']],
  defines: [['stats', 'function', 'returns (count, last)']],
  starter: py`def stats(A, n):
    # write your code here
    pass
`,
  setup: py`d = PARAMS['d']
A = [int(x) for x in np.random.randint(-20, 40, size=np.random.randint(8, 14))]
n = int(np.random.randint(2, 6))
`,
  check: py`d = S['d']
def ref(A, n):
    return (sum(1 for a in A if a % d == 0), A[::-1][:n])
cases = [(S['A'], S['n'])]
for k, m in [(10, 3), (7, 1), (15, 7), (5, 5), (12, 4)]:
    cases.append(([int(x) for x in np.random.randint(-50, 50, size=k)], int(m)))
G.expect_fn('stats', cases, ref, 10)
`,
  hint: 'Use the modulo operator a % d == 0 inside a loop. Slicing A[::-1] reverses a list.',
  solution: p => py`def stats(A, n):
    count = 0
    for a in A:
        if a % ${p.d} == 0:
            count += 1
    last = A[::-1][:n]
    return (count, last)
`
},
{
  id: 'l1-runmax', lab: 1, title: 'Running maximum',
  params: r => ({}),

  check: py`def mk(n, lower):
    A = np.random.randn(n, n)

fc = [(S['L'], S['b'])] + [(mk(k, True), np.random.randn(k)) for k in [1, 3, 6, 9]]

  solution: p => py`import numpy as np

def forward_sub(L, b):
    n = len(b)
    x = np.zeros(n)
    for i in range(n):
        x[i] = (b[i] - L[i, :i] @ x[:i]) / L[i, i]

def back_sub(U, y):

    x = np.zeros(n)
    for i in range(n - 1, -1, -1):

{ id: 'r-band', s: 'solve', q: 'n × n matrix with 2 on the diagonal and −1 just above and below.', o: ['2*np.eye(n) - np.eye(n, k=1) - np.eye(n, k=-1)', '2*np.eye(n) - np.eye(n+1)', 'np.diag(2) - np.diag(-1)', '2*np.ones((n, n)) - np.eye(n)'], why: '`np.eye(n, k=1)` is ones one step above the diagonal, `k=-1` one step below.' },

/* graphs */
{ id: 'r-le2', s: 'graphs', q: 'Count walks of length at most 2.', o: ['A + A @ A', 'A @ A', 'A + A * A', '2 * A'], why: '`A * A` is entrywise and equals A for a 0/1 matrix.' },
{ id: 'r-ij', s: 'graphs', q: 'Entry `M[i, j]` of a walk-count matrix counts walks…', o: ['from j to i', 'from i to j', 'from i back to i', 'in either direction only'], plain: true, why: 'Columns are "from", rows are "to". The index is [to, from].' },
{ id: 'r-ordlax', s: 'graphs', q: 'ORD is airport 58 and LAX is 77 (zero-indexed). Routes ORD → LAX:', o: ['M[77, 58]', 'M[58, 77]', 'M[78, 59]', 'M[59, 78]'], why: '[to, from], and the numbers are already zero-indexed, so no +1.' },
{ id: 'r-allk', s: 'graphs', q: 'True when every pair is joined by a walk of length ≤ k.', o: ['np.all(la.matrix_power(np.eye(n) + A, k) > 0)', 'np.all(la.matrix_power(A, k) > 0)', 'np.any(la.matrix_power(np.eye(n) + A, k) > 0)', 'la.matrix_power(np.eye(n) + A, k) > 0'], why: 'Adding I lets shorter walks count. The last option is an array of booleans, not one True/False.' },
{ id: 'r-eye', s: 'graphs', q: 'Why add `np.eye(n)` before raising to the power k?', o: ['so walks shorter than k still count', 'to make A invertible', 'to remove self-loops', 'to normalize rows'], plain: true, why: 'The identity acts like "stay put" steps, so (I+A)^k covers lengths 0 through k.' },
{ id: 'r-null', s: 'graphs', q: 'Number of connected components from incidence matrix `D`.', o: ['nullspace(D).shape[1]', 'nullspace(D).shape[0]', 'D.shape[0]', 'D.shape[1]'], why: 'nullspace returns basis vectors as columns, and there is one per component.' },
{ id: 'r-all', s: 'graphs', q: '`np.all(M > 0)` returns…', o: ['a single True or False', 'an array of booleans', 'the count of positive entries', 'M with negatives set to 0'], plain: true, why: '`M > 0` is the boolean array, `np.all` collapses it.' },
{ id: 'r-deg', s: 'graphs', q: 'Directed graph, `W[i, j] = 1` when j links to i. Incoming links per page:', o: ['np.sum(W, axis=1)', 'np.sum(W, axis=0)', 'np.sum(W)', 'W.T @ W'], why: 'Row i lists who links to i, so sum each row (axis=1).' },

/* dct */
{ id: 'r-coords', s: 'dct', q: 'Columns of `B` are an orthonormal basis. Coordinates of `x`:', o: ['B.T @ x', 'B @ x', 'x / B', 'np.sum(B * x)'], why: 'x = B c and inv(B) = B.T for orthonormal columns, so c = B.T @ x.' },
{ id: 'r-cback', s: 'dct', q: 'Turn coordinates `c` back into the signal.', o: ['B @ c', 'B.T @ c', 'la.inv(B) @ c', 'c / B'], why: 'Signal = basis times coordinates.' },
{ id: 'r-mask', s: 'dct', q: 'Zero every entry of `c` with absolute value below 1.', o: ['c[np.abs(c) < 1] = 0', 'c[c < 1] = 0', 'c = np.abs(c) < 1', 'c[np.abs(c) > 1] = 0'], why: '`c < 1` would also wipe large negative entries. The third option replaces c with booleans.' },
{ id: 'r-2d', s: 'dct', q: '2D DCT coefficients of an 8 × 8 `chunk`.', o: ['B.T @ chunk @ B', 'B @ chunk @ B.T', 'B.T @ chunk', 'chunk @ B @ B.T'], why: 'Transform the columns with B.T on the left and the rows with B on the right.' },
{ id: 'r-2dback', s: 'dct', q: 'Undo the 2D DCT of `C`.', o: ['B @ C @ B.T', 'B.T @ C @ B', 'B @ C', 'C @ B.T'], why: 'Reverse each side: B on the left, B.T on the right.' },
{ id: 'r-loop', s: 'dct', q: 'Top-left row index of every 8 × 8 block in a 512 × 512 image.', o: ['for i in range(0, 512, 8)', 'for i in range(512 // 8)', 'for i in range(8, 512, 8)', 'for i in range(0, 504)'], why: '`range(512 // 8)` gives block numbers 0–63, not pixel offsets.' },
{ id: 'r-block', s: 'dct', q: 'The 8 × 8 block starting at `(i, j)`.', o: ['image[i:i+8, j:j+8]', 'image[i:8, j:8]', 'image[i:i+7, j:j+7]', 'image[i+8, j+8]'], why: 'Stop is excluded, so i:i+8 is exactly 8 rows.' },
{ id: 'r-tol', s: 'dct', q: 'Tolerance = 10% of the largest absolute coefficient in `C`.', o: ['0.1 * np.max(np.abs(C))', '0.1 * np.max(C)', 'np.max(np.abs(C)) / 0.1', '10 * np.max(np.abs(C))'], why: 'Use the absolute value: the biggest coefficient can be negative.' },
{ id: 'r-gen', s: 'dct', q: 'Columns of `B` are a basis but NOT orthonormal. Coordinates of `x`:', o: ['la.inv(B) @ x', 'B.T @ x', 'B @ x', 'x @ B'], why: 'B.T only equals inv(B) for orthonormal bases like the DCT.' },

/* exam */
{ id: 'r-syntax', s: 'exam', q: 'Your code has a SyntaxError on the last line. What gets graded?', o: ['nothing, the question scores 0', 'everything above that line', 'everything except the last variable', 'the grader skips that line'], plain: true, why: 'Code that does not parse never runs. Run it before you submit.' },
{ id: 'r-ellip', s: 'exam', q: 'You leave `T = ...` from the starter code.', o: ['that check scores 0', 'the grader fills it in', 'syntax error, everything scores 0', 'it counts as an empty array'], plain: true, why: '`...` is valid Python (Ellipsis), so other parts still grade, but T gets no credit.' },
{ id: 'r-hard', s: 'exam', q: 'The example uses `n = 4` and you write `return A[:4]`.', o: ['fails, the tests use other inputs', 'passes, the example is the test', 'passes for lists, fails for arrays', 'syntax error'], plain: true, why: 'Always use the given variables. Graders run hidden test cases.' },
{ id: 'r-name', s: 'exam', q: 'Asked for `sheared_and_rotated`, you define `sheared_rotated`.', o: ['that check scores 0', 'the grader matches close names', 'everything scores 0', 'it passes with a warning'], plain: true, why: 'The autograder looks up the exact name in the table.' },
{ id: 'r-ban', s: 'exam', q: 'The question blocks `np.linalg.solve` and you call it anyway.', o: ['it raises an error, no credit', 'it works but loses points', 'it silently returns zeros', 'it is allowed if you import it as la'], plain: true, why: 'Have inv or the LU recipe ready instead.' }
];

</script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const QBY = Object.fromEntries(QUESTIONS.concat(DRILLS).map(q => [q.id, q]));
DRILLS.forEach(d => d.kind = 'drill');
QUESTIONS.forEach(q => { q.kind = 'app'; q.uses = USES[q.id] || []; });
const PTS = 10;

/* storage */
const KEY = 'm257-quiz-sim-v1';
let store = { best: {}, tries: {}, code: {}, seeds: {}, exam: null, history: [], streak: 0 };
try { const raw = localStorage.getItem(KEY); if (raw) store = Object.assign(store, JSON.parse(raw)); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} };
const best = id => store.best[id] || 0;
const tries = id => store.tries[id] || 0;
const done = id => best(id) >= PTS;

/* rng */
function rng(seed) {
  let a = seed >>> 0;
  const f = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  return { f, int: (lo, hi) => lo + Math.floor(f() * (hi - lo + 1)), pick: arr => arr[Math.floor(f() * arr.length)] };
}
const newSeed = () => 1000 + Math.floor(Math.random() * 899000);
function paramsFor(q, seed) { let p = q.params(rng(seed)); if (q.fix) p = q.fix(p); return p; }
const seedOf = id => store.seeds[id] || (store.seeds[id] = newSeed());

/* python */
let worker = null, ready = false, pending = new Map(), runId = 0, timer = null, rtState = ['load', 'starting python'];
function startWorker() {
  ready = false; setRt('load', 'starting python');
  try { worker = new Worker('worker.js'); } catch (e) { setRt('bad', 'python unavailable'); return; }
  worker.onmessage = ev => {
    const m = ev.data;
    if (m.type === 'status') setRt('load', m.text.toLowerCase());
    else if (m.type === 'ready') { ready = true; setRt('ok', 'python ready'); refreshRun(); }
    else if (m.type === 'fatal') { setRt('bad', 'python failed to load'); console.error(m.text); }
    else if (m.type === 'result') { const cb = pending.get(m.id); if (cb) { pending.delete(m.id); clearTimeout(timer); cb(m.result); } }
  };
  worker.onerror = e => { setRt('bad', 'python failed to load'); console.error(e.message); };
}
function setRt(k, t) { rtState = [k, t]; const el = $('#rt'); if (el) { el.className = 'rt ' + k; el.lastChild.textContent = t; } }
const rtHTML = () => `<span class="rt ${rtState[0]}" id="rt"><i></i><span>${esc(rtState[1])}</span></span>`;
function runPython(q, seed, code) {
  return new Promise(resolve => {
    const id = ++runId; pending.set(id, resolve);
    worker.postMessage({ id, setup: q.setup, check: q.check, user: code, seed, params: paramsFor(q, seed), banned: q.banned || [] });
    timer = setTimeout(() => {
      if (!pending.has(id)) return;
      pending.delete(id); worker.terminate();
      resolve({ error: 'Stopped after 20 seconds. Probably a loop that never ends.', items: [], score: 0, stdout: '' });
      startWorker();
    }, 20000);
  });
}

/* editor */
let editor = null, fallback = null;
const isDark = () => { const t = document.documentElement.getAttribute('data-theme'); return t ? t === 'dark' : !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches); };
const aceTheme = () => isDark() ? 'ace/theme/tomorrow_night' : 'ace/theme/tomorrow';
function mountEditor(el, value, onChange) {
  editor = null; fallback = null;
  if (window.ace) {
    try {
      ace.config.set('basePath', 'https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.6/');
      editor = ace.edit(el, { mode: 'ace/mode/python', theme: aceTheme(), fontSize: Math.round(parseFloat(getComputedStyle(document.documentElement).fontSize) * 0.92), tabSize: 4, useSoftTabs: true, showPrintMargin: false, showGutter: false, highlightActiveLine: false, useWorker: false, fontFamily: '"Geist Mono", ui-monospace, Menlo, monospace' });
      editor.renderer.setPadding(14); editor.renderer.setScrollMargin(12, 12);
      editor.container.style.background = 'transparent';
      editor.session.setValue(value);
      editor.session.on('change', () => onChange(editor.getValue()));
      editor.commands.addCommand({ name: 'run', bindKey: { win: 'Ctrl-Enter', mac: 'Cmd-Enter' }, exec: () => grade() });
      return;
    } catch (e) { editor = null; }
  }
  const ta = document.createElement('textarea');
  ta.id = 'editorFallback'; ta.className = el.className; ta.spellcheck = false; ta.value = value;
  ta.addEventListener('input', () => onChange(ta.value));
  ta.addEventListener('keydown', e => {
    if (e.key === 'Tab') { e.preventDefault(); ta.setRangeText('    ', ta.selectionStart, ta.selectionEnd, 'end'); onChange(ta.value); }
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); grade(); }
  });
  el.replaceWith(ta); fallback = ta;
}
const getCode = () => editor ? editor.getValue() : fallback ? fallback.value : '';
function setCode(v) { if (editor) editor.session.setValue(v); else if (fallback) fallback.value = v; }
const retheme = () => editor && editor.setTheme(aceTheme());
window.addEventListener('resize', () => { if (editor) { editor.setFontSize(Math.round(parseFloat(getComputedStyle(document.documentElement).fontSize) * 0.92)); editor.resize(); } });
if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', retheme);
new MutationObserver(retheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

/* sound: synthesized with Web Audio, no files */
let actx = null;
const soundOn = () => store.sound !== false;
function audio() {
  if (!actx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; try { actx = new C(); } catch (e) { return null; } }
  if (actx.state === 'suspended') actx.resume().catch(() => {});
  return actx;
}
['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, () => { if (soundOn()) audio(); }, { capture: true }));
function tone(ctx, t0, freq, dur, type, vol, slideTo) {
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(ctx.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
function sfx(kind) {
  if (!soundOn()) return;
  const ctx = audio(); if (!ctx) return;
  const t = ctx.currentTime + 0.01;
  if (kind === 'right') {
    tone(ctx, t, 880, 0.12, 'sine', 0.22);
    tone(ctx, t + 0.09, 1318.5, 0.28, 'sine', 0.22);
    tone(ctx, t + 0.09, 2637, 0.2, 'sine', 0.04);
  } else if (kind === 'big') {
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(ctx, t + i * 0.075, f, 0.3, 'triangle', 0.18));
  } else {
    tone(ctx, t, 196, 0.16, 'square', 0.07, 165);
    tone(ctx, t + 0.15, 147, 0.28, 'square', 0.07, 110);
  }
}
const sndHTML = () => `<button type="button" class="link snd" aria-pressed="${soundOn()}">${soundOn() ? 'sound on' : 'sound off'}</button>`;
document.addEventListener('click', e => {
  const b = e.target.closest('.snd'); if (!b) return;
  store.sound = !soundOn(); save();
  document.querySelectorAll('.snd').forEach(x => { x.textContent = soundOn() ? 'sound on' : 'sound off'; x.setAttribute('aria-pressed', soundOn()); });
  if (soundOn()) sfx('right');
});

/* confetti */
function burst(x, y) {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = document.createElement('canvas'); c.className = 'fx';
  const dpr = window.devicePixelRatio || 1; c.width = innerWidth * dpr; c.height = innerHeight * dpr; c.style.width = innerWidth + 'px'; c.style.height = innerHeight + 'px';
  document.body.appendChild(c);
  const g = c.getContext('2d'); g.scale(dpr, dpr);
  const cs = getComputedStyle(document.documentElement);
  const cols = [cs.getPropertyValue('--accent'), cs.getPropertyValue('--ok'), cs.getPropertyValue('--fg')].map(s => s.trim());
  const ps = Array.from({ length: 36 }, (_, i) => { const a = Math.random() * Math.PI * 2, s = 3 + Math.random() * 6; return { x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 4, r: 2 + Math.random() * 3, c: cols[i % 3] }; });
  let f = 0;
  (function step() {
    g.clearRect(0, 0, innerWidth, innerHeight);
    ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.35; p.vx *= 0.98; g.globalAlpha = Math.max(0, 1 - f / 45); g.fillStyle = p.c; g.beginPath(); g.arc(p.x, p.y, p.r, 0, 7); g.fill(); });
    if (++f < 45) requestAnimationFrame(step); else c.remove();
  })();
}

/* state */
let view = 'home', mode = 'drills', cur = 0, list = [];
let last = null, showSol = false, showHint = false, busy = false, justPassed = false;
const isMock = () => mode === 'mock';
const LABEL = q => q.kind === 'drill' ? GROUPS[q.group] : LABS[q.lab];
const dotCls = (b, t, h) => !t ? '' : b >= PTS ? 'full' : h ? 'help' : 'part';
const helped = id => !!(store.helped || {})[id];
const itemCls = id => dotCls(best(id), tries(id), helped(id));
const aided = x => (store.aid || {})[x.id] === x.seed;
function markAid(x) { (store.aid = store.aid || {})[x.id] = x.seed; save(); }
function nextUnsolved() {
  for (const pass of [q => !done(q.id) && !helped(q.id), q => !done(q.id)]) {
    const d = DRILLS.find(pass); if (d) return ['drills', d.id];
    const a = QUESTIONS.find(pass); if (a) return ['apps', a.id];
  }
  return null;
}

/* home */
function renderHome() {
  view = 'home'; closeDrawer();
  const dDone = DRILLS.filter(q => done(q.id)).length, aDone = QUESTIONS.filter(q => done(q.id)).length;
  const nu = nextUnsolved();
  const ex = store.exam && !store.exam.done;
  const hist = (store.history || []).slice(-6);
  const dots = (arr, m) => `<div class="dots">${arr.map(q => `<button type="button" class="d ${itemCls(q.id)}" data-m="${m}" data-id="${q.id}" title="${esc(q.title)}" aria-label="${esc(q.title)}"></button>`).join('')}</div>`;
  $('#app').innerHTML = `<main class="page">
    <div class="top"><span>wed 10/28 · 6:15 pm · chem annex</span><span class="sp"></span>${rtHTML()}${sndHTML()}<button type="button" class="link" id="refBtn">reference</button></div>
    <section class="hero">
      <h1>python quiz 1<span>.</span></h1>
      <p>Learn each move, then put moves together. Real NumPy grades every run.</p>
    </section>
    <div>${nu ? `<button type="button" class="go" id="go">${nu[0] === 'drills' ? 'Continue' : 'Next problem'} <small>${esc(QBY[nu[1]].title)}</small> →</button>` : `<button type="button" class="go" id="mockGo">Everything solved. Try a mock quiz →</button>`}</div>
    <section class="tracks">
      <div class="track">
        <div class="track-h"><button type="button" id="recall">Recall</button><span class="n">${rLearned()}/${RECALL.length} learned${rBest() ? ' · best ' + rBest() : ''}</span></div>
        <p>A card game for everything that is not in the course doc. 3 lives.</p>
        <div class="dots">${RECALL.map(c => `<span class="d ${rCls(c.id)}" title="${esc(RECALL_SECTIONS[c.s])}"></span>`).join('')}</div>
      </div>
      <div class="track">
        <div class="track-h"><button type="button" data-open="drills">Moves</button><span class="n">${dDone}/${DRILLS.length}</span></div>
        ${dots(DRILLS, 'drills')}
      </div>
      <div class="track">
        <div class="track-h"><button type="button" data-open="apps">Problems</button><span class="n">${aDone}/${QUESTIONS.length}</span></div>
        ${dots(QUESTIONS, 'apps')}
      </div>
      <div class="track">
        <div class="track-h"><button type="button" id="mock">${ex ? 'Resume mock quiz' : 'Mock quiz'}</button><span class="n">4 problems · no hints</span></div>
        ${hist.length ? `<div class="past">${hist.map(h => `${h.score}/${h.max}`).join('  ·  ')}</div>` : ''}
      </div>
    </section>
  </main>`;
  if ($('#go')) $('#go').onclick = () => openList(nu[0], nu[1]);
  if ($('#mockGo')) $('#mockGo').onclick = startExam;
  $('#mock').onclick = () => ex ? openExam() : startExam();
  $('#recall').onclick = startRecall;
  document.querySelectorAll('[data-open]').forEach(b => b.onclick = () => { const m = b.dataset.open; const src = m === 'drills' ? DRILLS : QUESTIONS; const f = src.find(q => !done(q.id)) || src[0]; openList(m, f.id); });
  document.querySelectorAll('button.d').forEach(b => b.onclick = () => openList(b.dataset.m, b.dataset.id));
  $('#refBtn').onclick = toggleDrawer;
}

function openList(m, id) {
  mode = m;
  list = (m === 'drills' ? DRILLS : QUESTIONS).map(q => ({ id: q.id, seed: seedOf(q.id) }));
  save();
  cur = Math.max(0, list.findIndex(x => x.id === id));
  last = null; showSol = showHint = justPassed = false;
  renderWork(); window.scrollTo({ top: 0 });
}

/* mock */
function startExam() {
  const labs = [1, 2, 3, 4, 5, 6].sort(() => Math.random() - 0.5).slice(0, 4).sort();
  const qs = labs.map(l => { const pool = QUESTIONS.filter(q => q.lab === l); return { id: pool[Math.floor(Math.random() * pool.length)].id, seed: newSeed() }; });
  store.exam = { qs, done: false, best: {}, tries: {}, code: {}, last: {} };
  save(); openExam();
}
function openExam() { mode = 'mock'; list = store.exam.qs; cur = 0; last = store.exam.last[0] || null; showSol = showHint = justPassed = false; renderWork(); window.scrollTo({ top: 0 }); }
function finishExam() {
  const ex = store.exam; if (!ex || ex.done) return;
  ex.done = true;
  store.history = (store.history || []).concat([{ at: Date.now(), score: ex.qs.reduce((s, _, i) => s + (ex.best[i] || 0), 0), max: ex.qs.length * PTS }]).slice(-20);
  save(); renderSummary();
}

/* work */
const loadCode = i => { const q = QBY[list[i].id]; const c = isMock() ? store.exam.code[i] : store.code[q.id]; return c != null ? c : q.starter; };
function storeCode(v) { if (isMock()) { if (!store.exam.done) store.exam.code[cur] = v; } else store.code[list[cur].id] = v; clearTimeout(storeCode.t); storeCode.t = setTimeout(save, 400); }
const bestAt = i => isMock() ? (store.exam.best[i] || 0) : best(list[i].id);
const triesAt = i => isMock() ? (store.exam.tries[i] || 0) : tries(list[i].id);
const navCls = i => isMock() ? dotCls(bestAt(i), triesAt(i)) : itemCls(list[i].id);

function renderWork() {
  view = 'work';
  const x = list[cur], q = QBY[x.id], p = paramsFor(q, x.seed), learn = !isMock();
  const passed = learn && last && last.score >= PTS;

async function grade() {
  if (!ready || busy || view !== 'work' || (isMock() && store.exam.done)) return;
  busy = true; refreshRun();
  const i = cur, x = list[i], q = QBY[x.id], code = getCode();
  storeCode(code);
  const res = await runPython(q, x.seed, code);
  busy = false;
  const wasDone = bestAt(i) >= PTS;
  const assisted = !isMock() && aided(x);
  res.assisted = assisted;
  if (isMock()) {
    store.exam.tries[i] = (store.exam.tries[i] || 0) + 1;
    store.exam.best[i] = Math.max(store.exam.best[i] || 0, res.score || 0);
    store.exam.last[i] = res;
  } else {
    store.tries[q.id] = tries(q.id) + 1;
    store.helped = store.helped || {};
    if (assisted) {
      store.best[q.id] = Math.max(best(q.id), Math.min(res.score || 0, PTS - 1));
      if (res.score >= PTS) store.helped[q.id] = true;
      else store.streak = 0;
    } else {
      store.best[q.id] = Math.max(best(q.id), res.score || 0);
      if (res.score >= PTS) delete store.helped[q.id];
      store.streak = res.score >= PTS ? (store.streak || 0) + 1 : 0;
    }
  }
  save();
  if (view === 'work' && cur === i) {
    last = res;
    justPassed = res.score >= PTS && !wasDone && !assisted;
    renderKeep();

    if (res.score >= PTS && !assisted) { const r = $('#run').getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2); }

}

/* recall game */
const rStore = () => store.recall || (store.recall = { best: 0, cards: {}, games: 0 });

const rBest = () => rStore().best || 0;

  const w = c => { const k = rCard(c.id); return rIsLearned(c.id) ? 1 : 3 + k.wrong * 2; };

  view = 'game'; closeDrawer(); renderGame(); window.scrollTo({ top: 0 });
}

  }).join('');

    <div class="g-bar">

      <span class="g-score"><b>${G.score}</b></span>

    </div>

      <div class="eyebrow">${esc(RECALL_SECTIONS[c.s].toLowerCase())} · ${G.i + 1} of ${G.deck.length}${G.elim ? ' · <span class="aid">hint used · half points, not counted toward learned</span>' : ''}</div>
      <h2>${fmtq(c.q)}</h2>
    </section>

  $('#db').innerHTML = `<input id="refQ" type="search" placeholder="search" value="${esc(refQ)}" aria-label="Search the reference">${html || '<p class="empty">No matches.</p>'}`;
  const s = $('#refQ');
  s.oninput = () => { refQ = s.value; const pos = s.selectionStart; renderDrawer(); const n = $('#refQ'); n.focus(); n.setSelectionRange(pos, pos); };
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

if (store.exam && store.exam.dur !== undefined) { delete store.exam.dur; delete store.exam.start; }
startWorker();
renderHome();
})();
</script>
